name: tests

on:
  push:
  pull_request:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard library tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests
